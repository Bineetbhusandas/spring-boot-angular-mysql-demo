<div class="app-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" routerLink="/tasks" aria-label="Taskboard home">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span class="brand-text">
          <span class="brand-name">Taskboard</span>
          <span class="brand-tagline">Spring Boot · Angular · MySQL</span>
        </span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a
          routerLink="/tasks"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Tasks
        </a>
        <a routerLink="/tasks/new" routerLinkActive="active">New task</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <p>Three-tier demo · Angular 22 · Spring Boot 4 · MySQL 8</p>
  </footer>
</div>

<app-toast />
