server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. Images and fonts are already compressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compose healthcheck target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # API reverse proxy.
    #   Browser -> nginx :8080 /api/... -> app:8080 /api/...
    # `resolver 127.0.0.11` is Docker's embedded DNS, so nginx can resolve the
    # app container name. Using a variable makes nginx re-resolve at runtime,
    # which survives a rebuilt app container getting a new IP address.
    # `^~` makes this prefix win over the static-asset regex below.
    # -----------------------------------------------------------------------
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://app:8080;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Never cache the entry document, so a new deployment is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Content-hashed bundles can be cached aggressively.
    location ~* \.(?:css|js|mjs|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links such as /tasks/5/edit return index.html and the
    # Angular router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
