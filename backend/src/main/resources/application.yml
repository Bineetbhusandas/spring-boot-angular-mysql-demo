spring:
  application:
    name: spring-boot-docker-demo

  datasource:
    # DB_HOST=mysql inside Docker Compose (service name on the demo-net network).
    # DB_PORT defaults to 3307 so the app also works from the host against the
    # MySQL container's published port.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dockerdemo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:demo123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 10

app:
  cors:
    # Comma-separated list, e.g. http://localhost:4200,http://localhost:4300
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

logging:
  level:
    com.example.dockerdemo: INFO
